<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>NotaMais · Display de balcão</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1080px;height:1350px;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#e5e7eb;display:grid;place-items:center;overflow:hidden}
  .tag{position:absolute;top:40px;left:0;right:0;text-align:center;font-size:26px;color:#6b7280;font-weight:600}
  .card{width:760px;background:#fff;border-radius:36px;padding:60px 56px;text-align:center;box-shadow:0 30px 70px rgba(17,24,39,.18)}
  .biz{font-size:30px;font-weight:700;color:#6b7280;letter-spacing:1px;text-transform:uppercase}
  h1{font-size:58px;line-height:1.1;margin:18px 0 10px;color:#111827}
  .stars{font-size:72px;color:#fbbf24;letter-spacing:6px;margin:6px 0 24px}
  .qr{width:380px;height:380px;margin:0 auto;padding:18px;border:4px solid #111827;border-radius:28px}
  .qr svg{width:100%;height:100%}
  .how{font-size:30px;color:#374151;margin-top:26px;line-height:1.35}
  .how b{color:#111827}
  .g{margin-top:22px;font-size:24px;color:#9ca3af}
</style></head>
<body>
  <div class="tag">__TAG__</div>
  <div class="card">
    <div class="biz">__NEGOCIO__</div>
    <h1>Gostou do atendimento?</h1>
    <div class="stars">★★★★★</div>
    <div class="qr">__QR__</div>
    <p class="how">Aponte a câmera do celular<br>e <b>avalie a gente no Google</b>.<br>Leva 30 segundos 💛</p>
    <p class="g">Sua opinião ajuda muito o nosso negócio!</p>
  </div>
</body></html>
