<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>NotaMais · Prospecção</title>
<style>
  :root{ --bg:#0b0f16; --card:#141a26; --card2:#1b2232; --line:rgba(255,255,255,.09); --txt:#eef1f8; --dim:#8c94a8;
         --acc:#22c55e; --acc2:#16a34a; --gold:#fbbf24; --red:#f43f5e; --blue:#38bdf8; }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  body{ margin:0; background:var(--bg); color:var(--txt); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  header{ position:sticky; top:0; z-index:5; background:rgba(11,15,22,.94); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:12px 16px; }
  h1{ font-size:17px; margin:0 0 2px; }
  .sub{ color:var(--dim); font-size:12px; }
  .stats{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 8px; }
  .stat{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px 10px; font-size:12px; color:var(--dim); }
  .stat b{ color:var(--txt); font-size:15px; margin-right:4px; }
  .filters{ display:flex; gap:8px; flex-wrap:wrap; }
  .filters select, .filters input{ background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:13px; max-width:100%; }
  .filters input{ flex:1 1 160px; }
  main{ padding:14px 16px 60px; max-width:920px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }
  .lead{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .lead.done{ opacity:.55; }
  .top{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .name{ font-weight:700; font-size:15px; word-break:break-word; }
  .meta{ color:var(--dim); font-size:12.5px; margin-top:2px; }
  .stars{ color:var(--gold); font-weight:700; }
  .score{ flex:none; border-radius:999px; padding:4px 10px; font-weight:800; font-size:12px; background:var(--card2); }
  .score.hot{ background:linear-gradient(135deg,#f97316,#f43f5e); color:#fff; }
  .score.warm{ background:linear-gradient(135deg,#fbbf24,#f59e0b); color:#1b1300; }
  .why{ margin:8px 0; display:flex; gap:6px; flex-wrap:wrap; }
  .tag{ font-size:11px; padding:3px 8px; border-radius:999px; background:var(--card2); color:var(--dim); }
  .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  .btn{ border:none; border-radius:10px; padding:9px 12px; font-weight:700; font-size:13px; cursor:pointer; text-decoration:none; display:inline-flex; gap:6px; align-items:center; }
  .btn.wa{ background:var(--acc); color:#05210f; }
  .btn.fu{ background:var(--gold); color:#1b1300; }
  .btn.ghost{ background:var(--card2); color:var(--txt); border:1px solid var(--line); }
  select.status{ background:var(--card2); color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:8px; font-size:13px; }
  textarea{ width:100%; margin-top:8px; background:var(--card2); color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:8px; font:inherit; font-size:12.5px; min-height:38px; resize:vertical; }
  .alert{ color:var(--gold); font-size:12px; font-weight:700; }
  .empty{ text-align:center; color:var(--dim); padding:40px 10px; }
  a.lnk{ color:var(--blue); font-size:12.5px; }
  @media (max-width:640px){ header{ position:static; } }
  .imgs{ display:flex; gap:10px; margin:10px 0 2px; overflow-x:auto; }
  .imgcard{ flex:none; display:flex; gap:10px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px; }
  .imgcard img{ width:46px; height:58px; object-fit:cover; border-radius:6px; }
  .imgcard .t{ font-size:12px; font-weight:700; margin-bottom:4px; }
  .imgcard .b{ display:flex; gap:6px; }
  .mini{ border:none; border-radius:8px; padding:6px 9px; font-size:12px; font-weight:700; cursor:pointer; background:var(--card2); color:var(--txt); border:1px solid var(--line); }
  .btn.img{ background:#38bdf8; color:#04202e; }
  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#111827; color:#fff; border:1px solid var(--line); padding:10px 14px; border-radius:10px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:9; max-width:92vw; text-align:center; }
  .toast.show{ opacity:1; }
  details.resp{ margin-top:10px; background:var(--card2); border:1px solid var(--line); border-radius:12px; }
  details.resp > summary{ cursor:pointer; padding:10px 12px; font-weight:700; font-size:13px; list-style:none; }
  details.resp > summary::-webkit-details-marker{ display:none; }
  details.resp[open] > summary{ border-bottom:1px solid var(--line); }
  .respbody{ padding:10px 12px 12px; }
  .respbody select{ width:100%; background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:9px; font-size:13px; }
  .respbody textarea{ min-height:150px; background:var(--card); }
  .imgnote{ font-size:12px; color:#38bdf8; margin-top:6px; }
  .hint{ background:var(--card2); border:1px dashed var(--line); border-radius:12px; padding:10px 12px; color:var(--dim); font-size:12.5px; }
</style>
</head>
<body>
<header>
  <h1>🎯 NotaMais · Prospecção</h1>
  <div class="sub" id="sub"></div>
  <div class="stats" id="stats"></div>
  <div class="imgs" id="imgs"></div>
  <div class="filters">
    <input type="search" id="q" placeholder="Buscar nome ou endereço…" aria-label="Buscar">
    <select id="fStatus" aria-label="Status"></select>
    <select id="fCat" aria-label="Categoria"></select>
    <select id="fScore" aria-label="Pontuação">
      <option value="0">Qualquer pontuação</option>
      <option value="70" selected>Pontuação ≥ 70 (melhores)</option>
      <option value="50">Pontuação ≥ 50</option>
    </select>
    <button class="btn ghost" id="exportar" type="button">⬇ Exportar status (CSV)</button>
  </div>
</header>
<main id="list"></main>
<div class="toast" id="toast" role="status"></div>

<script type="application/json" id="dados">/*__DADOS__*/{}</script>
<script>
(function(){
  'use strict';
  var DATA = JSON.parse(document.getElementById('dados').textContent || '{}');
  var LEADS = Array.isArray(DATA.leads) ? DATA.leads : [];
  var META = DATA.meta || {};
  // só aceita PNG embutido pelo próprio robô
  var RESPOSTAS = (Array.isArray(DATA.respostas) ? DATA.respostas : []).filter(function(r){ return r && typeof r.texto === 'string' && typeof r.titulo === 'string'; });
  function fimTeste(){ var d = new Date(); d.setDate(d.getDate() + 30); return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear(); }
  function preencher(texto, l){
    return texto.replace(/\{loja\}/g, l.nome).replace(/\{nome\}/g, META.nome || '').replace(/\{fimTeste\}/g, fimTeste());
  }
  function waTexto(l, texto){ return 'https://wa.me/' + l.telefone.e164 + '?text=' + encodeURIComponent(texto); }

  /* Bloco "Respostas prontas" de uma loja (montado só quando aberto). */
  function blocoRespostas(l, s){
    var det = el('details', 'resp');
    det.appendChild(el('summary', null, '💬 Respostas prontas (' + RESPOSTAS.length + ')'));
    var montado = false;
    det.addEventListener('toggle', function(){
      if(!det.open || montado) return;
      montado = true;
      var body = el('div', 'respbody');
      var sel = el('select'); sel.setAttribute('aria-label', 'Escolha a resposta');
      var grupos = {};
      RESPOSTAS.forEach(function(r, i){
        var g = r.grupo || 'Outras';
        if(!grupos[g]){ grupos[g] = document.createElement('optgroup'); grupos[g].label = g; sel.appendChild(grupos[g]); }
        grupos[g].appendChild(new Option(r.titulo, String(i)));
      });
      var ta = el('textarea'); ta.setAttribute('aria-label', 'Texto da resposta (pode editar)');
      var note = el('div', 'imgnote');
      var row = el('div', 'row');
      var env = el('a', 'btn wa', '💬 Enviar no WhatsApp'); env.target = '_blank'; env.rel = 'noopener noreferrer';
      var cop = el('button', 'btn ghost', '⧉ Copiar'); cop.type = 'button';
      var img = el('button', 'btn img', ehCelular ? '🖼️ Enviar imagem' : '🖼️ Copiar imagem'); img.type = 'button';
      function atual(){ return RESPOSTAS[parseInt(sel.value, 10)] || RESPOSTAS[0]; }
      function atualizar(){
        var r = atual();
        ta.value = preencher(r.texto, l);
        env.href = waTexto(l, ta.value);
        var temImg = typeof r.imagem === 'number' && IMAGENS[r.imagem];
        img.hidden = !temImg;
        note.textContent = temImg ? '📎 Mande junto a imagem "' + IMAGENS[r.imagem].titulo + '" (botão azul).' : '';
      }
      sel.addEventListener('change', atualizar);
      ta.addEventListener('input', function(){ env.href = waTexto(l, ta.value); });
      env.addEventListener('click', function(){
        var r = atual();
        // registra o andamento: quem recebe resposta já respondeu
        if(s.status === 'novo' || s.status === 'enviado' || s.status === 'followup') { s.status = /Follow-up/.test(r.titulo) ? 'followup' : 'respondeu'; save(); setTimeout(refresh, 300); }
      });
      cop.addEventListener('click', function(){
        (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(function(){ toast('Resposta copiada'); }, function(){ prompt('Copie a resposta:', ta.value); });
      });
      img.addEventListener('click', function(){ var r = atual(); if(typeof r.imagem === 'number' && IMAGENS[r.imagem]) anexar(IMAGENS[r.imagem]); });
      row.appendChild(env); row.appendChild(img); row.appendChild(cop);
      body.appendChild(sel); body.appendChild(ta); body.appendChild(note); body.appendChild(row);
      det.appendChild(body);
      atualizar();
    });
    return det;
  }

  var IMAGENS = (Array.isArray(DATA.imagens) ? DATA.imagens : []).filter(function(i){ return i && /^data:image\/png;base64,[A-Za-z0-9+\/=]+$/.test(i.dataUrl || ''); });

  var toastTimer = null;
  function toast(msg){
    var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3500);
  }
  function blobDe(img){ return fetch(img.dataUrl).then(function(r){ return r.blob(); }); }
  function podeCompartilhar(){
    try{ return !!(navigator.canShare && navigator.canShare({ files: [new File([new Blob(['x'], { type:'image/png' })], 'x.png', { type:'image/png' })] })); }catch(e){ return false; }
  }
  var ehCelular = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  function compartilhar(img){
    return blobDe(img).then(function(b){
      return navigator.share({ files: [new File([b], img.arquivo, { type:'image/png' })] });
    }).then(function(){ toast('Escolha o WhatsApp e a conversa (ela fica no topo da lista).'); }, function(e){ if(!e || e.name !== 'AbortError') baixar(img); });
  }
  function copiar(img){
    if(!window.ClipboardItem || !navigator.clipboard || !navigator.clipboard.write){ baixar(img); return; }
    // o Promise dentro do ClipboardItem mantém o "gesto do usuário" no Safari
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blobDe(img) })]).then(function(){
      toast('Imagem copiada! Na conversa do WhatsApp Web/Desktop, aperte Ctrl+V (Cmd+V no Mac).');
    }, function(){ baixar(img); });
  }
  function baixar(img){
    var a = document.createElement('a'); a.href = img.dataUrl; a.download = img.arquivo; document.body.appendChild(a); a.click(); a.remove();
    toast('Imagem baixada: anexe pelo clipe 📎 na conversa do WhatsApp.');
  }
  /* Celular: compartilhar; computador: copiar (Ctrl+V); sem suporte: baixar. */
  function anexar(img){
    if(ehCelular && podeCompartilhar()) return compartilhar(img);
    if(!ehCelular) return copiar(img);
    baixar(img);
  }

  (function renderImgs(){
    var box = document.getElementById('imgs');
    IMAGENS.forEach(function(img){
      var c = el('div', 'imgcard');
      var th = el('img'); th.src = img.dataUrl; th.alt = img.titulo; c.appendChild(th);
      var right = el('div'); right.appendChild(el('div', 't', img.titulo));
      var b = el('div', 'b');
      var a1 = el('button', 'mini', ehCelular ? '📤 Compartilhar' : '⧉ Copiar'); a1.type = 'button';
      a1.addEventListener('click', function(){ anexar(img); });
      var a2 = el('button', 'mini', '⬇ Baixar'); a2.type = 'button';
      a2.addEventListener('click', function(){ baixar(img); });
      b.appendChild(a1); b.appendChild(a2); right.appendChild(b); c.appendChild(right);
      box.appendChild(c);
    });
  })();
  var FOLLOWUP_DIAS = 3;
  var STATUS = [
    ['novo', '⚪ Novo'], ['enviado', '📤 Mensagem enviada'], ['followup', '🔁 Follow-up enviado'],
    ['respondeu', '💬 Respondeu'], ['interessado', '🔥 Interessado'], ['piloto', '🧪 Em teste grátis'],
    ['cliente', '💰 Cliente pagante'], ['nao', '🚫 Não quer / não insistir'], ['invalido', '❌ Sem WhatsApp']
  ];
  var LABEL = {}; STATUS.forEach(function(s){ LABEL[s[0]] = s[1]; });
  var KEY = 'notamais:crm:' + (META.cidade || '');

  function load(){ try{ return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }catch(e){ return {}; } }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(crm)); }catch(e){} }
  var crm = load();
  function st(id){ return crm[id] || (crm[id] = { status:'novo', nota:'', enviadoEm:0 }); }
  function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
  function dias(ts){ return ts ? Math.floor((Date.now() - ts) / 86400000) : 0; }
  function fmt(n){ return n ? n.toFixed(1).replace('.', ',') : '–'; }
  function today(ts){ var d = new Date(ts), n = new Date(); return d.toDateString() === n.toDateString(); }

  // filtros
  var fStatus = document.getElementById('fStatus'), fCat = document.getElementById('fCat');
  fStatus.appendChild(new Option('Todos os status', ''));
  fStatus.appendChild(new Option('⏰ Precisa de follow-up', '__fu'));
  STATUS.forEach(function(s){ fStatus.appendChild(new Option(s[1], s[0])); });
  fCat.appendChild(new Option('Todas as categorias', ''));
  Array.from(new Set(LEADS.map(function(l){ return l.categoria; }))).sort().forEach(function(c){ fCat.appendChild(new Option(c, c)); });

  function precisaFollowup(id){ var s = st(id); return s.status === 'enviado' && dias(s.enviadoEm) >= FOLLOWUP_DIAS; }

  function renderStats(){
    var c = {}; var hoje = 0, fu = 0;
    LEADS.forEach(function(l){ var s = st(l.id); c[s.status] = (c[s.status] || 0) + 1; if(s.enviadoEm && today(s.enviadoEm)) hoje++; if(precisaFollowup(l.id)) fu++; });
    var box = document.getElementById('stats'); box.innerHTML = '';
    [['Enviadas hoje', hoje], ['Follow-ups pendentes', fu], ['Respostas', (c.respondeu||0)+(c.interessado||0)+(c.piloto||0)+(c.cliente||0)],
     ['Em teste', c.piloto || 0], ['Clientes', c.cliente || 0]].forEach(function(x){
      var s = el('div', 'stat'); s.appendChild(el('b', null, String(x[1]))); s.appendChild(document.createTextNode(x[0])); box.appendChild(s);
    });
  }

  function render(){
    var q = document.getElementById('q').value.trim().toLowerCase();
    var fs = fStatus.value, fc = fCat.value, min = parseInt(document.getElementById('fScore').value, 10) || 0;
    var list = document.getElementById('list'); list.innerHTML = '';
    var shown = LEADS.filter(function(l){
      var s = st(l.id);
      if(fs === '__fu' ? !precisaFollowup(l.id) : (fs && s.status !== fs)) return false;
      if(fc && l.categoria !== fc) return false;
      if(l.score < min) return false;
      if(q && (l.nome + ' ' + l.endereco).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    if(!LEADS.length) list.appendChild(el('div', 'empty', 'Nenhum lead. Rode o robô de novo com outra cidade ou categorias.'));
    else if(!shown.length) list.appendChild(el('div', 'empty', 'Nada com esses filtros.'));
    else if(fs === '' && min >= 70) {
      list.appendChild(el('div', 'hint', 'Comece pelos de cima. Para cada loja: 1) “Enviar no WhatsApp” abre a conversa com a mensagem: envie. 2) Volte aqui e toque em “Enviar imagem” (celular: escolha o WhatsApp e a conversa no topo) ou “Copiar imagem” (computador: Ctrl+V na conversa). Uma loja por vez.'));
    }

    shown.slice(0, 300).forEach(function(l){
      var s = st(l.id);
      var card = el('div', 'lead' + (s.status === 'nao' || s.status === 'invalido' ? ' done' : ''));
      var top = el('div', 'top');
      var left = el('div');
      left.appendChild(el('div', 'name', l.nome));
      var meta = el('div', 'meta');
      if(l.semAvaliacoes){
        meta.appendChild(document.createTextNode(l.categoria + ' · ' + l.telefoneTexto));
      } else {
        meta.appendChild(el('span', 'stars', '★ ' + fmt(l.rating)));
        meta.appendChild(document.createTextNode(' · ' + l.userRatingCount + ' avaliações · ' + l.categoria + ' · ' + l.telefoneTexto));
      }
      left.appendChild(meta);
      left.appendChild(el('div', 'meta', l.endereco));
      top.appendChild(left);
      top.appendChild(el('div', 'score' + (l.score >= 70 ? ' hot' : l.score >= 50 ? ' warm' : ''), l.score + ' pts'));
      card.appendChild(top);

      var why = el('div', 'why');
      (l.motivos || []).forEach(function(m){ why.appendChild(el('span', 'tag', m)); });
      card.appendChild(why);

      if(precisaFollowup(l.id)) card.appendChild(el('div', 'alert', '⏰ Mensagem enviada há ' + dias(s.enviadoEm) + ' dias sem resposta: mande o follow-up (só um).'));

      var row = el('div', 'row');
      var wa = el('a', 'btn wa', '💬 Enviar no WhatsApp');
      wa.href = l.whatsapp; wa.target = '_blank'; wa.rel = 'noopener noreferrer';
      wa.addEventListener('click', function(){ if(s.status === 'novo'){ s.status = 'enviado'; s.enviadoEm = Date.now(); save(); setTimeout(refresh, 300); } });
      row.appendChild(wa);
      if(precisaFollowup(l.id)){
        var fu = el('a', 'btn fu', '🔁 Follow-up');
        fu.href = l.whatsappFollowup; fu.target = '_blank'; fu.rel = 'noopener noreferrer';
        fu.addEventListener('click', function(){ s.status = 'followup'; save(); setTimeout(refresh, 300); });
        row.appendChild(fu);
      }
      if(IMAGENS.length){
        var im = el('button', 'btn img', ehCelular ? '🖼️ Enviar imagem' : '🖼️ Copiar imagem'); im.type = 'button';
        im.title = 'Depois de abrir a conversa, anexe a imagem "Como funciona"';
        im.addEventListener('click', function(){ anexar(IMAGENS[0]); });
        row.appendChild(im);
      }
      var cp = el('button', 'btn ghost', '⧉ Copiar mensagem'); cp.type = 'button';
      cp.addEventListener('click', function(){
        (navigator.clipboard ? navigator.clipboard.writeText(l.mensagem) : Promise.reject()).then(function(){ cp.textContent = '✓ Copiada'; }, function(){ prompt('Copie a mensagem:', l.mensagem); });
      });
      row.appendChild(cp);
      var sel = el('select', 'status'); sel.setAttribute('aria-label', 'Status de ' + l.nome);
      STATUS.forEach(function(x){ var o = new Option(x[1], x[0]); if(x[0] === s.status) o.selected = true; sel.appendChild(o); });
      sel.addEventListener('change', function(){ s.status = sel.value; if(sel.value === 'enviado' && !s.enviadoEm) s.enviadoEm = Date.now(); save(); refresh(); });
      row.appendChild(sel);
      if(l.maps && /^https:\/\/(www\.)?(maps\.)?google\.[a-z.]+\//.test(l.maps)){
        var mp = el('a', 'lnk', l.semAvaliacoes ? '🔎 Conferir avaliações no Google Maps ↗' : 'Ver no Google Maps ↗'); mp.href = l.maps; mp.target = '_blank'; mp.rel = 'noopener noreferrer'; row.appendChild(mp);
      }
      card.appendChild(row);

      if(RESPOSTAS.length) card.appendChild(blocoRespostas(l, s));
      var ta = el('textarea'); ta.placeholder = 'Anotações (nome do dono, melhor horário, objeções…)'; ta.value = s.nota || '';
      ta.addEventListener('input', function(){ s.nota = ta.value; save(); });
      card.appendChild(ta);
      list.appendChild(card);
    });
    renderStats();
  }
  function refresh(){ var y = window.scrollY; render(); window.scrollTo(0, y); }

  document.getElementById('sub').textContent = (META.cidade || '') + ' · ' + LEADS.length + ' negócios com telefone · gerado em ' + (META.geradoEm ? new Date(META.geradoEm).toLocaleDateString('pt-BR') : '');
  ['q', 'fStatus', 'fCat', 'fScore'].forEach(function(id){ document.getElementById(id).addEventListener('input', render); });
  document.getElementById('exportar').addEventListener('click', function(){
    function c(v){ var s = v == null ? '' : String(v); if(/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; }
    var lines = [['nome','categoria','telefone','status','enviado em','anotações'].map(c).join(';')];
    LEADS.forEach(function(l){ var s = st(l.id); lines.push([l.nome, l.categoria, l.telefoneTexto, LABEL[s.status], s.enviadoEm ? new Date(s.enviadoEm).toLocaleDateString('pt-BR') : '', s.nota].map(c).join(';')); });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type:'text/csv' }));
    a.download = 'notamais-status.csv'; a.click();
  });
  render();
})();
</script>
</body>
</html>
